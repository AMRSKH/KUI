<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#151b28"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#232d42" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="url(#accentGlow)"/>

  <!-- Terminal Top Bar Window Dots -->
  <circle cx="90" cy="90" r="14" fill="#f43f5e"/>
  <circle cx="130" cy="90" r="14" fill="#f59e0b"/>
  <circle cx="170" cy="90" r="14" fill="#10b981"/>

  <!-- Terminal prompt chevron ">" -->
  <path d="M 100 180 L 190 256 L 100 332" fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal cursor block "_" -->
  <rect x="220" y="310" width="70" height="22" rx="6" fill="#38bdf8"/>

  <!-- Stylized Khmer Ka glyph "ក" and KUI text -->
  <text x="360" y="270" font-family="system-ui, sans-serif" font-size="110" font-weight="900" fill="#22d3ee" text-anchor="middle">ក</text>
  <text x="256" y="420" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="8">KUI</text>
</svg>
