[package]
name = "kui"
version = "0.1.5"
description = "KUI - Khmer Unicode & TUI Optimized Terminal Emulator"
authors = ["KUI Team"]
edition = "2021"

[lib]
name = "kui_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
